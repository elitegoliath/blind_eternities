name: Release Open Core

# Only trigger this workflow when a tag starting with 'v' is pushed
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Compile for all major operating systems
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install globally via Homebrew on macOS runners
      - name: Install Protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Install globally via Chocolatey on Windows runners
      - name: Install Protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y
    
      - name: Build wheels using Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -i 3.11
          # manylinux ensures the Linux wheel works across most distributions
          manylinux: 2_28
          before-script-linux: |
            dnf install -y openssl-devel unzip
            curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip
            unzip protoc-25.3-linux-x86_64.zip -d /usr/local
            chmod +x /usr/local/bin/protoc

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  create-github-release:
    name: Create GitHub Release
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all cross-compiled wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # Attach all downloaded wheels to the release
          files: dist/*
          # Automatically generate a changelog based on merged PRs
          generate_release_notes: true