services:
  llm-engine:
    image: ollama/ollama:latest
    container_name: blind-eternities-llm
    environment:
      - LANCEDB_URI=./data/lancedb
    ports:
      - "11434:11434"
    volumes:
      # This mount is CRITICAL. It ensures downloaded models persist
      # between container restarts.
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # Or 'amd' depending on your GPU
              count: 1       # Allocate 1 GPU
              capabilities:
                - GPU
  
  llm-puller:
    image: ollama/ollama:latest
    container_name: blind-eternities-llm-puller
    depends_on:
      - llm-engine
    environment:
      # Tell this temporary container to talk to the engine container
      - OLLAMA_HOST=llm-engine:11434
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for Ollama engine to wake up...';
      while ! ollama list > /dev/null 2>&1; do sleep 2; done;
      echo 'Pulling qwen3:9b (this will take a few minutes on first run)...';
      ollama pull qwen3:9b;
      echo 'Model is locked and loaded!';
      "

  blind-eternities-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blind-eternities-app
    environment:
      # Tell the container to not wait to print to the terminal
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=not-needed-for-local
      - LLM_BASE_URL=http://llm-engine:11434/v1
      # Tell LangChain exactly which Ollama model to request
      - LLM_MODEL_NAME=qwen3:9b
    volumes:
      # Maps the local ./data folder to the container's /app/data folder
      - ./data:/app/data
    depends_on:
      # Wait for the model to finish downloading before starting Python
      llm-puller:
        condition: service_completed_successfully
      llm-engine:
        condition: service_started
    # Keeps the container running so we can interact with the terminal
    stdin_open: true
    tty: true

volumes:
  ollama_data: