version: '3.8'

services:
  llm-engine:
    image: ollama/ollama:latest
    container_name: blind-eternities-llm
    ports:
      - "11434:11434"
    volumes:
      # This mount is CRITICAL. It ensures downloaded models persist
      # between container restarts.
      - ollama_data:/root/.ollama
    # AUTOMATION STEP:
    # This boots the ollama server in the background, waits for it to respond,
    # pulls the model if it doesn't exist, and then brings the server to the foreground.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        ollama serve &
        until curl -s http://localhost:11434/api/tags > /dev/null; do sleep 1; done
        echo ">>> Checking for model llama3.1..."
        ollama pull llama3.1
        wait
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # Or 'amd' depending on your GPU
              count: 1       # Allocate 1 GPU
              capabilities:
                - GPU
  
  blind-eternities-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blind-eternities-app
    environment:
      - OPENAI_API_KEY=not-needed-for-local
      - LLM_BASE_URL=http://llm-engine:11434/v1
      # Tell LangChain exactly which Ollama model to request
      - LLM_MODEL_NAME=llama3.1
    volumes:
      # Maps the local ./data folder to the container's /app/data folder
      - ./data:/app/data
    depends_on:
      - llm-engine
    # Keeps the container running so we can interact with the terminal
    stdin_open: true
    tty: true

volumes:
  ollama_data: